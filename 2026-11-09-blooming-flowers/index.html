<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05030f">
<title>for anushkebi 💐</title>
<meta name="description" content="A bouquet that keeps blooming, for anushkebi.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="scene" id="scene" aria-label="A growing bouquet of flowers for anushkebi">
  <div class="sky"></div>
  <div class="moon"></div>
  <div class="stars" id="stars"></div>

  <h1 class="message"><span>for anushkebi</span><small id="hint">tap to add more flowers</small></h1>

  <div class="bouquet" id="bouquet">
    <div class="wrap back"></div>
    <div class="stalks" id="stalks"></div>
    <div class="wrap front"></div>
    <div class="bow"><i class="loop l"></i><i class="loop r"></i><i class="tail l"></i><i class="tail r"></i><i class="knot"></i></div>
  </div>

  <div class="particles" id="particles"></div>
</main>
<script src="script.js"></script>
</body>
</html>
